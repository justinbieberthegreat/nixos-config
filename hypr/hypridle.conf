general {
 lock_cmd = pidof hyprlock || hyprlock
 before_sleep_cmd = loginctl lock-session
 after_sleep_cmd = niri msg action power-on-monitors


}

listener {
    timeout = 300
    on-timeout = /run/current-system/sw/bin/loginctl lock-session
}

listener {
    timeout = 340
    on-timeout = /run/current-system/sw/bin/niri msg action power-off-monitors
    on-resume = /run/current-system/sw/bin/niri msg action power-on-monitors
}

listener {
    timeout = 370
    on-timeout = /run/current-system/sw/bin/systemctl suspend
}
