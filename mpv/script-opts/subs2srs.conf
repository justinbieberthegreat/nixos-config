###
### mpvacious configuration
### Destination: ~/.config/mpv/script-opts/subs2srs.conf
###

## --- Anki note mapping ---
## These five match the AJATT "Japanese sentences" note type.
## Change them to match your own note type's actual field names.
deck_name=japanese
model_name=Lapis Simplified

sentence_field=Sentence
secondary_field=
audio_field=SentenceAudio
image_field=Picture

ankiconnect_url=127.0.0.1:8765
create_deck=yes
allow_duplicates=no

## --- Clipboard / Yomitan lookup ---
## Copies each subtitle line to the clipboard as it appears, so a
## page Yomitan is scanning (via the Clipboard Inserter extension)
## can look words up without you touching Anki mid-episode.
autoclip=yes
autoclip_method=clipboard
nuke_spaces=yes         
clipboard_trim_enabled=yes

## --- Media for the cards ---
snapshot_format=avif
snapshot_quality=80
snapshot_width=-1280
snapshot_height=1

audio_format=opus
audio_bitrate=24k
audio_padding=0.15      

## --- Secondary (English) subtitles ---
secondary_sub_auto_load=yes
secondary_sub_lang=eng,en
secondary_sub_area=0.15
# 'auto' = only visible while hovering the top of the window (closer to
# full immersion). Switch to 'always' for a traditional dual-subtitle look.
secondary_sub_visibility=auto

## --- If audio/image export fails on your system ---
## Uncomment if mpv's built-in encoder can't cut clips (needs ffmpeg installed).
# use_ffmpeg=yes
