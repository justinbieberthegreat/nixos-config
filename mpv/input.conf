Alt+= add sub-scale +0.05
Alt+- add sub-scale -0.05
K cycle sub
J cycle sub down
 
# Nudge subtitle timing by 50ms — for badly-synced subs
Z add sub-delay +0.05
z add sub-delay -0.05
 
# Step subtitle timing to the previous/next line without seeking
X sub-step 1
x sub-step -1

Ctrl+r set sub-pos 97; show-text "Sub position reset"
